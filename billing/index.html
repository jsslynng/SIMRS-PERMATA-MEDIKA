<script>
/* ==== shared/core.js ==== */
/* =========================================================
   core.js : utilitas, penyimpanan data, sesi, autentikasi,
             pengecekan RBAC, router, toast & modal
             (dipakai bersama oleh ketiga aplikasi)
   ========================================================= */

/* ---------- Utilitas ---------- */
const U = {
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('en-US'); },
  num(n) { return Number(n || 0).toLocaleString('en-US'); },
  pad(n, w = 2) { return String(n).padStart(w, '0'); },
  time(iso) { const d = new Date(iso); return U.pad(d.getHours()) + ':' + U.pad(d.getMinutes()); },
  date(iso) { const d = new Date(iso); return U.pad(d.getDate()) + '/' + U.pad(d.getMonth() + 1) + '/' + d.getFullYear(); },
  dateTime(iso) { return U.date(iso) + ' ' + U.time(iso); },
  ymd(d = new Date()) { return String(d.getFullYear()).slice(2) + U.pad(d.getMonth() + 1) + U.pad(d.getDate()); },
  isoDay(d = new Date()) { return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()); },
  isToday(iso) { return U.isoDay(new Date(iso)) === U.isoDay(); },
  daysUntil(isoDate) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const e = new Date(isoDate + 'T00:00:00');
    return Math.round((e - t) / 86400000);
  },
  monthYear(isoDate) { const [y, m] = isoDate.split('-'); return m + '/' + y; },
  initials(name) {
    return String(name).replace(/^(dr\.|apt\.)\s*/i, '').split(/\s+/).filter(Boolean)
      .map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  },
  icon(name, cls = '') { return `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`; },
  qs(sel, root = document) { return root.querySelector(sel); },
  qsa(sel, root = document) { return [...root.querySelectorAll(sel)]; },
  on(root, sel, ev, fn) { U.qsa(sel, root).forEach((el) => el.addEventListener(ev, fn)); },
  /* unduh tabel sebagai CSV (Excel-friendly) */
  downloadCsv(filename, head, rows) {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = [head, ...rows].map((r) => r.map(q).join(',')).join('\r\n');
    try {
      const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      UI.toast(`File ${filename} diunduh`, 'info');
    } catch (e) { UI.toast('Browser ini tidak mengizinkan unduhan file.', 'bad'); }
  },
};

/* ---------- Penyimpanan aman (fallback ke memori bila browser memblokir storage) ---------- */
const Safe = {
  mem: {},
  get(area, k) { try { return window[area].getItem(k); } catch (e) { return this.mem[area + k] ?? null; } },
  set(area, k, v) { try { window[area].setItem(k, v); } catch (e) { this.mem[area + k] = v; } },
  del(area, k) { try { window[area].removeItem(k); } catch (e) { /* abaikan */ } delete this.mem[area + k]; },
};

/* ---------- Database (localStorage) ---------- */
const Store = {
  db: null,
  load() {
    let data = null;
    try { data = JSON.parse(Safe.get('localStorage', APP.storeKey) || 'null'); } catch (e) { data = null; }
    if (!data || data.version !== APP.dbVersion) { data = seedDB(); this.db = data; this.save(); }
    this.db = data;
    return data;
  },
  save() { Safe.set('localStorage', APP.storeKey, JSON.stringify(this.db)); },
  reset() { Safe.del('localStorage', APP.storeKey); Session.clear(); this.db = null; return this.load(); },
  next(key) { this.db.seq[key] = (this.db.seq[key] || 0) + 1; this.save(); return this.db.seq[key]; },
  user(id) { return this.db.users.find((u) => u.id === id); },
  /* Audit trail: setiap aksi penting dicatat */
  audit({ module, activity, result = 'Success', actor }) {
    const u = actor || Auth.user();
    this.db.audit.unshift({
      ts: new Date().toISOString(),
      user: u ? u.name : '-',
      role: u && ROLES[u.role] ? ROLES[u.role].short : '-',
      module, activity, result,
    });
    this.db.audit = this.db.audit.slice(0, 1000);
    this.save();
  },
};

/* ---------- Sesi login (sessionStorage per tab) ---------- */
const Session = {
  get() { try { return JSON.parse(Safe.get('sessionStorage', APP.sessionKey) || 'null'); } catch (e) { return null; } },
  set(s) { Safe.set('sessionStorage', APP.sessionKey, JSON.stringify(s)); },
  clear() { Safe.del('sessionStorage', APP.sessionKey); },
};

/* ---------- Autentikasi & RBAC ---------- */
const Auth = {
  user() {
    const s = Session.get();
    if (!s || !Store.db) return null;
    return Store.db.users.find((u) => u.id === s.userId) || null;
  },
  login(username, password) {
    const uname = String(username || '').trim().toLowerCase();
    const user = Store.db.users.find((u) => u.username.toLowerCase() === uname);
    if (!user || user.password !== password) {
      Store.audit({ module: 'Auth', activity: `Login gagal (${uname || 'tanpa username'})`, result: 'Failed', actor: { name: uname || '-', role: null } });
      return { ok: false, reason: 'invalid' };
    }
    if (user.status !== 'Active') {
      Store.audit({ module: 'Auth', activity: 'Login ditolak: akun nonaktif', result: 'Failed', actor: user });
      return { ok: false, reason: 'inactive', user };
    }
    // RBAC tingkat modul: role tanpa hak akses ke aplikasi ini ditolak sejak login
    if (!(PERMISSIONS[user.role] || []).length) {
      Store.audit({ module: 'RBAC', activity: `Login ditolak: role tanpa akses Modul ${APP.module}`, result: 'Denied', actor: user });
      return { ok: false, reason: 'noaccess', user };
    }
    Session.set({ userId: user.id, loginAt: new Date().toISOString() });
    user.lastLogin = new Date().toISOString();
    Store.save();
    Store.audit({ module: 'Auth', activity: 'Login', actor: user });
    return { ok: true, user };
  },
  logout(reason) {
    const u = this.user();
    if (u) Store.audit({ module: 'Auth', activity: reason || 'Logout', actor: u });
    Session.clear();
  },
  /* Kebijakan password: minimal 8 karakter, berisi huruf dan angka */
  passwordProblem(pw) {
    if (!pw || pw.length < 8) return 'Password minimal 8 karakter.';
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Password harus berisi huruf dan angka.';
    if (pw === APP.defaultPassword) return 'Password baru tidak boleh sama dengan password awal.';
    return '';
  },
  /* Cek hak akses role yang sedang login */
  can(perm) {
    const u = this.user();
    return !!u && (PERMISSIONS[u.role] || []).includes(perm);
  },
  /* Halaman pertama yang boleh dibuka untuk sebuah menu */
  firstRoute(menuItem) {
    if (menuItem.route && (!menuItem.perm || this.can(menuItem.perm))) return menuItem.route;
    const c = (menuItem.children || []).find((ch) => this.can(ch.perm));
    return c ? c.route : null;
  },
  visibleMenu() {
    return MENU.map((m) => {
      if (m.children) {
        const children = m.children.filter((c) => this.can(c.perm));
        return children.length ? { ...m, children } : null;
      }
      return this.can(m.perm) ? m : null;
    }).filter(Boolean);
  },
};

/* ---------- Router (hash) ----------
   Posisi halaman disimpan di Router.current, lalu disalin ke URL (#/...) bila browser
   mengizinkan. Dengan begitu aplikasi tetap jalan walau dibuka sebagai file di
   viewer HP (mis. pratinjau file di aplikasi) yang membatasi perubahan URL. */
const Router = {
  routes: [],
  current: '',
  add(pattern, def) { this.routes.push({ pattern, parts: pattern.split('/'), ...def }); },
  read() {
    try { return String(location.hash || '').replace(/^#\/?/, ''); } catch (e) { return null; }
  },
  setHash(path, replace) {
    const target = '#/' + path;
    try {
      if (location.hash === target) return;
      if (replace) { history.replaceState(null, '', location.href.split('#')[0] + target); return; }
    } catch (e) { /* lanjut ke cara biasa */ }
    try { location.hash = target; } catch (e) { /* URL tidak bisa diubah: cukup pakai Router.current */ }
  },
  parse() {
    const [path, qs = ''] = this.current.split('?');
    return { path: path || '', query: Object.fromEntries(new URLSearchParams(qs)) };
  },
  match(path) {
    const segs = path.split('/');
    for (const r of this.routes) {
      if (r.parts.length !== segs.length) continue;
      const params = {};
      const ok = r.parts.every((p, i) => {
        if (p.startsWith(':')) { params[p.slice(1)] = decodeURIComponent(segs[i]); return true; }
        return p === segs[i];
      });
      if (ok) return { route: r, params };
    }
    return null;
  },
  /* pindah halaman (selalu render ulang, termasuk ke halaman yang sama) */
  go(path) { this.current = path; this.setHash(path, false); App.render(); },
  /* ganti alamat tanpa render (dipakai saat redirect di dalam render) */
  replace(path) { this.current = path; this.setHash(path, true); },
  /* tombol back/forward browser atau alamat diketik manual */
  onHashChange() {
    const h = this.read();
    if (h === null || h === this.current) return;
    this.current = h;
    App.render();
  },
};

/* ---------- UI: toast & modal ---------- */
const UI = {
  toast(msg, type = 'ok') {
    const root = document.getElementById('toast-root');
    const t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(() => t.classList.add('hide'), 3200);
    setTimeout(() => t.remove(), 3700);
  },
  /* modal({title, body(html), actions:[{label, cls, value}]}) -> Promise<value|null> */
  modal({ title, body = '', actions = [{ label: 'Tutup', cls: 'btn', value: null }], onOpen, wide = false }) {
    return new Promise((resolve) => {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal ${wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title">${U.esc(title)}</h2>
            <div class="modal-body">${body}</div>
            <div class="modal-actions">
              ${actions.map((a, i) => `<button type="button" class="${a.cls || 'btn'}" data-i="${i}">${U.esc(a.label)}</button>`).join('')}
            </div>
          </div>
        </div>`;
      const close = (v) => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') close(null); };
      document.addEventListener('keydown', onKey);
      U.qsa('[data-i]', root).forEach((b) => b.addEventListener('click', () => {
        const a = actions[Number(b.dataset.i)];
        close(typeof a.value === 'function' ? a.value(root) : a.value);
      }));
      U.qs('.modal-backdrop', root).addEventListener('click', (e) => { if (e.target.classList.contains('modal-backdrop')) close(null); });
      if (onOpen) onOpen(root);
      const primary = U.qs('.btn-primary, .btn-danger', root) || U.qs('button', root);
      if (primary) primary.focus();
    });
  },
  confirm(title, message, okLabel = 'Ya, lanjutkan', danger = false) {
    return this.modal({
      title,
      body: `<p>${message}</p>`,
      actions: [
        { label: 'Batal', cls: 'btn', value: false },
        { label: okLabel, cls: danger ? 'btn btn-danger' : 'btn btn-primary', value: true },
      ],
    });
  },
};

/* ---------- Komponen HTML kecil yang dipakai berulang ---------- */
const C = {
  pageHead(title, subtitle, right = '') {
    return `<div class="page-head"><div><h1>${U.esc(title)}</h1><p class="subtitle">${U.esc(subtitle)}</p></div>${right ? `<div class="page-head-actions">${right}</div>` : ''}</div>`;
  },
  statusPill(status) {
    const map = {
      Active: 'ok', Inactive: 'muted', Ready: 'info', Verify: 'warn', Pending: 'warn', Invoiced: 'info',
      Unpaid: 'warn', Paid: 'ok', Verified: 'ok', 'Claim Submitted': 'ok', Submitted: 'ok', Open: 'info',
      Received: 'ok', Issued: 'ok', 'Awaiting approval': 'warn', Approved: 'ok', Rejected: 'bad',
      Success: 'ok', Failed: 'bad', Denied: 'bad', Draft: 'warn', Partial: 'warn',
      Penerimaan: 'ok', Pengeluaran: 'info', Adjustment: 'warn', 'Saldo awal': 'muted',
      Invoice: 'info', Pembayaran: 'ok', Klaim: 'ok',
    };
    return `<span class="pill pill-${map[status] || 'muted'}">${U.esc(status)}</span>`;
  },
  empty(title, text, action = '') {
    return `<div class="empty"><h3>${U.esc(title)}</h3><p>${text}</p>${action}</div>`;
  },
};

</script>
<script>
/* ==== shared/login.js ==== */
/* =========================================================
   Login — autentikasi pengguna (dipakai ketiga aplikasi)
   ========================================================= */

function renderLogin(root, message) {
  const canUse = (u) => (PERMISSIONS[u.role] || []).length > 0;
  const users = [...Store.db.users].sort((a, b) =>
    (canUse(b) && b.status === 'Active') - (canUse(a) && a.status === 'Active'));
  const demo = users.map((u) => {
    const tag = u.status !== 'Active' ? ' <em>(nonaktif)</em>' : !canUse(u) ? ' <em>(tanpa akses modul ini)</em>' : '';
    return `
      <button type="button" class="demo-item" data-user="${U.esc(u.username)}">
        <span>${U.esc(ROLES[u.role].label)}${tag}</span>
        <strong>${U.esc(u.username)}</strong>
      </button>`;
  }).join('');

  root.innerHTML = `
  <div class="login">
    <section class="login-brand">
      <h1>SIMRS</h1>
      <div class="hosp">RS PERMATA MEDIKA</div>
      <div class="login-module">${U.esc(APP.moduleLong)}</div>
      <p class="tag">Secure access for authorized users</p>
      <div class="sec">RBAC &bull; HTTPS/TLS &bull; Audit trail</div>
    </section>

    <section class="login-form-wrap">
      <div class="login-form" id="login-form" role="form" aria-label="Sign in">
        <h2>Sign in</h2>
        <p class="sub">Masukkan kredensial SIMRS</p>

        <div class="field">
          <label for="username">Username *</label>
          <input class="input" id="username" name="username" placeholder="Enter username" autocomplete="username" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Password *</label>
          <input class="input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <label class="show-pw"><input type="checkbox" id="show-pw"> Show password</label>

        <button class="btn btn-primary btn-block" type="button" id="login-btn">Login</button>
        <p class="login-error" id="login-error" role="alert">${message ? U.esc(message) : ''}</p>

        <details class="demo" open>
          <summary>Akun demo — password awal semua akun: <code>${APP.defaultPassword}</code></summary>
          <p class="demo-hint">Ketuk salah satu akun untuk mengisi username &amp; password, lalu tekan Login.</p>
          <div class="demo-list">${demo}</div>
          <button type="button" class="linkish" id="reset-demo">Reset data demo ke kondisi awal</button>
        </details>
      </div>
    </section>
  </div>`;

  const err = U.qs('#login-error', root);
  const uEl = U.qs('#username', root);
  const pEl = U.qs('#password', root);

  U.qs('#show-pw', root).addEventListener('change', (e) => { pEl.type = e.target.checked ? 'text' : 'password'; });

  // tanpa <form>: beberapa viewer file di HP memblokir form submit
  const doLogin = () => {
    err.textContent = '';
    if (!uEl.value.trim() || !pEl.value) {
      err.textContent = 'Username dan password wajib diisi.';
      (uEl.value.trim() ? pEl : uEl).focus();
      return;
    }
    const res = Auth.login(uEl.value, pEl.value);
    if (!res.ok) {
      err.textContent = {
        inactive: 'Akun nonaktif → akses ditolak. Hubungi Admin SIMRS untuk aktivasi.',
        noaccess: `Role ${res.user ? ROLES[res.user.role].label : ''} tidak memiliki akses ke ${APP.moduleLong} → akses ditolak.`,
      }[res.reason] || 'Invalid credentials → akses ditolak. Periksa username dan password.';
      pEl.value = '';
      pEl.focus();
      return;
    }
    UI.toast(`Login berhasil sebagai ${ROLES[res.user.role].label}`);
    Router.go('dashboard');
  };
  U.qs('#login-btn', root).addEventListener('click', doLogin);
  [uEl, pEl].forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } }));

  U.qsa('.demo-item', root).forEach((btn) => btn.addEventListener('click', () => {
    uEl.value = btn.dataset.user;
    const u = Store.db.users.find((x) => x.username === btn.dataset.user);
    // akun dengan password sementara/awal terisi otomatis; akun yang sudah ganti password diketik manual
    pEl.value = u && u.password === APP.defaultPassword ? APP.defaultPassword : '';
    err.textContent = '';
    (pEl.value ? U.qs('#login-btn', root) : pEl).focus();
  }));

  U.qs('#reset-demo', root).addEventListener('click', async () => {
    const ok = await UI.confirm('Reset data demo', `Semua perubahan di ${APP.moduleLong} akan dikembalikan ke data awal.`, 'Reset data', true);
    if (ok) { Store.reset(); renderLogin(root); UI.toast('Data demo sudah dikembalikan ke kondisi awal.'); }
  });

  if (window.matchMedia && window.matchMedia('(min-width: 861px)').matches) uEl.focus();
}

</script>
<script>
/* ==== apps/billing/pages.js ==== */
/* =========================================================
   APLIKASI 2 — halaman Modul Billing & Penjamin
   Dashboard · Tagihan · Pembayaran · Invoice · Verifikasi · Klaim · Laporan
   ========================================================= */

const Bill = {
  filter: { q: '', day: 'today', payer: '' },
  checked: {},
  report: null,
  total(items) { return items.reduce((s, i) => s + i.amount, 0); },
  bill(visit) { return Store.db.bills.find((b) => b.visit === visit); },
  invoice(no) { return Store.db.invoices.find((i) => i.no === no); },
  editable(b) { return ['Ready', 'Verify', 'Pending'].includes(b.status); },
  isValidMember(b, no) { return b.payer === 'BPJS' ? /^\d{13}$/.test(no) : /^POL-\d{8}$/.test(no); },
  itemsTable(items, removable) {
    return `<div class="table-wrap"><table class="tbl">
      <thead><tr><th>Kategori</th><th>Layanan / Item</th><th class="num">Subtotal</th>${removable ? '<th>Aksi</th>' : ''}</tr></thead>
      <tbody>${items.map((i) => `<tr><td>${U.esc(i.cat)}</td><td>${U.esc(i.name)}</td><td class="num">${U.num(i.amount)}</td>${removable ? `<td><button type="button" class="link link-bad" data-rm="${i.code}">Hapus</button></td>` : ''}</tr>`).join('')
        || `<tr><td colspan="${removable ? 4 : 3}" class="muted center">Belum ada layanan.</td></tr>`}</tbody>
    </table></div>`;
  },
  flow(active) {
    const steps = ['Kunjungan', 'Tagihan', 'Invoice', 'Pembayaran', 'Kuitansi'];
    return `<div class="flow-hint">Alur: ${steps.map((s) => (s === active ? `<b>${s}</b>` : s)).join(' → ')}</div>`;
  },
};

/* ---------- Dashboard ---------- */
Router.add('dashboard', {
  perm: 'dashboard', title: 'Dashboard',
  render(el, { user }) {
    const db = Store.db;
    const todayBills = db.bills.filter((b) => b.date === U.isoDay());
    const paidToday = db.invoices.filter((i) => i.status === 'Paid' && U.isToday(i.paidAt));
    const cash = paidToday.reduce((s, i) => s + i.total, 0);
    const claimSum = db.claims.reduce((s, c) => s + c.amount, 0);
    const outstanding = db.bills.filter((b) => !['Paid', 'Claim Submitted'].includes(b.status)).reduce((s, b) => s + Bill.total(b.items), 0);
    const CARDS = {
      kasir: [
        { label: 'Tagihan Hari Ini', value: todayBills.length, cap: 'Kunjungan hari ini', go: 'billing' },
        { label: 'Siap Invoice', value: db.bills.filter((b) => b.payer === 'Self-Pay' && b.status === 'Ready').length, cap: 'Tagihan self-pay', go: 'billing' },
        { label: 'Belum Dibayar', value: db.invoices.filter((i) => i.status === 'Unpaid').length, cap: 'Invoice terbuka', go: 'billing/payment' },
        { label: 'Penerimaan Kas', value: U.rp(cash), cap: 'Hari ini', small: true, go: 'billing/invoice' },
      ],
      verifikator: [
        { label: 'Perlu Verifikasi', value: db.bills.filter((b) => b.payer !== 'Self-Pay' && ['Verify', 'Pending'].includes(b.status)).length, cap: 'BPJS & asuransi', go: 'penjamin/verify' },
        { label: 'Siap Klaim', value: db.bills.filter((b) => b.status === 'Verified').length, cap: 'Sudah terverifikasi', go: 'penjamin/claim' },
        { label: 'Klaim Terkirim', value: db.claims.length, cap: 'Total pengajuan', go: 'penjamin/claim' },
        { label: 'Nilai Klaim', value: U.rp(claimSum), cap: 'Diajukan ke penjamin', small: true, go: 'penjamin/claim' },
      ],
      supervisor_admin: [
        { label: 'Total Tagihan', value: U.rp(todayBills.reduce((s, b) => s + Bill.total(b.items), 0)), cap: 'Hari ini', small: true, go: 'reports' },
        { label: 'Penerimaan Kas', value: U.rp(cash), cap: 'Hari ini', small: true, go: 'reports' },
        { label: 'Nilai Klaim', value: U.rp(claimSum), cap: 'Diajukan ke penjamin', small: true, go: 'reports' },
        { label: 'Outstanding', value: U.rp(outstanding), cap: 'Belum lunas / belum diklaim', small: true, go: 'reports' },
      ],
    }[user.role] || [];
    const cards = CARDS.map((c) => `<a class="stat stat-link" href="#/${c.go}"><div class="stat-label">${c.label}</div><div class="stat-value ${c.small ? 'stat-value-sm' : ''}">${c.value}</div><div class="stat-cap">${c.cap}</div></a>`).join('');
    const quick = Auth.visibleMenu().filter((m) => m.key !== 'dashboard').flatMap((m) => (m.children || [m]).map((c) => `
      <a class="quick-row" href="#/${c.route}"><strong>${c.label}</strong><span>${c.desc || m.desc}</span></a>`)).join('');
    const mods = { kasir: ['Billing'], verifikator: ['Penjamin'] }[user.role];
    const acts = db.audit.filter((a) => a.module !== 'Auth' && a.module !== 'RBAC' && (!mods || mods.includes(a.module))).slice(0, 6)
      .map((a) => `<div class="act-row"><span>${U.esc(a.activity)}</span><time>${U.isToday(a.ts) ? U.time(a.ts) : U.date(a.ts)}</time></div>`).join('') || '<p class="muted">Belum ada aktivitas.</p>';
    el.innerHTML = `
      ${C.pageHead('Dashboard', `Ringkasan billing — ${ROLES[user.role].label}`)}
      <div class="stats">${cards}</div>
      <div class="grid-2">
        <section class="panel panel-md"><h2 class="panel-title">Quick Access</h2><div class="quick">${quick}</div></section>
        <section class="panel panel-md"><h2 class="panel-title">Recent Activity</h2><div class="acts">${acts}</div></section>
      </div>`;
  },
});

/* ---------- Daftar tagihan ---------- */
Router.add('billing', {
  perm: 'billing.list', title: 'Billing',
  render(el) {
    const f = Bill.filter;
    el.innerHTML = `
      ${C.pageHead('Billing', 'Pembentukan & Validasi Tagihan')}
      ${Bill.flow('Tagihan')}
      <div class="toolbar">
        <label class="search-inline">${U.icon('search')}<input id="b-q" placeholder="Search pasien / nomor kunjungan" value="${U.esc(f.q)}"></label>
        <select class="chip-select" id="b-day" aria-label="Filter tanggal">
          <option value="today" ${f.day === 'today' ? 'selected' : ''}>Today</option>
          <option value="all" ${f.day === 'all' ? 'selected' : ''}>Semua tanggal</option>
        </select>
        <select class="chip-select" id="b-payer" aria-label="Filter payer">
          <option value="">All payer</option>
          ${['Self-Pay', 'BPJS', 'Private Ins.'].map((p) => `<option ${f.payer === p ? 'selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>MRN</th><th>Pasien</th><th>No. Kunjungan</th><th>Poli</th><th>Payer</th><th class="num">Total</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="b-body"></tbody>
      </table></div>
      <p class="hint">Tagihan terbentuk otomatis dari layanan yang dicatat saat kunjungan (pendaftaran, poli, lab, radiologi, farmasi).</p>`;
    const body = U.qs('#b-body', el);
    const draw = () => {
      const q = f.q.toLowerCase(), today = U.isoDay();
      const rows = Store.db.bills.filter((b) =>
        (!q || [b.patient, b.visit, b.mrn].some((v) => v.toLowerCase().includes(q))) &&
        (f.day === 'all' || b.date === today) && (!f.payer || b.payer === f.payer));
      body.innerHTML = rows.map((b) => `
        <tr>
          <td>${b.mrn}</td><td>${U.esc(b.patient)}</td><td class="nowrap">${b.visit}</td><td>${U.esc(b.poli)}</td><td>${b.payer}</td>
          <td class="num">${U.num(Bill.total(b.items))}</td><td>${C.statusPill(b.status)}</td>
          <td><a class="link" href="#/billing/detail/${b.visit}">Open</a></td>
        </tr>`).join('') || '<tr><td colspan="8" class="muted center">Tidak ada tagihan untuk filter ini.</td></tr>';
    };
    draw();
    U.qs('#b-q', el).addEventListener('input', (e) => { f.q = e.target.value; draw(); });
    U.qs('#b-day', el).addEventListener('change', (e) => { f.day = e.target.value; draw(); });
    U.qs('#b-payer', el).addEventListener('change', (e) => { f.payer = e.target.value; draw(); });
  },
});

/* ---------- Detail tagihan, tambah layanan & generate invoice ---------- */
Router.add('billing/detail/:visit', {
  perm: 'billing.detail', title: 'Billing Detail',
  render(el, { params, user }) {
    const b = Bill.bill(params.visit);
    if (!b) { el.innerHTML = C.empty('Tagihan tidak ditemukan', 'Nomor kunjungan tidak terdaftar.', '<a class="btn" href="#/billing">Kembali</a>'); return; }
    const total = Bill.total(b.items);
    const selfPay = b.payer === 'Self-Pay';
    const canEdit = Auth.can('billing.edit') && Bill.editable(b);
    const codes = b.items.map((i) => i.code);
    const noDup = new Set(codes).size === codes.length;

    let action = '';
    if (selfPay && b.status === 'Ready') action = '<button class="btn btn-primary" id="gen-inv">Generate Invoice</button>';
    else if (selfPay && b.status === 'Invoiced') action = `<a class="btn btn-primary" href="#/billing/payment?inv=${b.invoice}">Lanjut ke Pembayaran</a>`;
    else if (selfPay && b.status === 'Paid') action = `<a class="btn btn-primary" href="#/billing/invoice?inv=${b.invoice}">Lihat Kuitansi</a>`;

    el.innerHTML = `
      ${C.pageHead('Billing Detail', 'Validasi komponen layanan & generate invoice')}
      ${Bill.flow('Tagihan')}
      <div class="panel">
        <div class="panel-top">
          <h2 class="panel-title">${U.esc(b.patient)} &bull; ${b.mrn}</h2>
          <div class="chips-row"><span class="badge b-info">${b.visit}</span><span class="badge b-ok">${U.esc(b.payerName)}</span>${C.statusPill(b.status)}</div>
        </div>
        <p class="muted small">${U.esc(b.poli)} &bull; tanggal kunjungan ${U.date(b.date + 'T00:00:00')}</p>
        <h3 class="sub-title">Komponen Tagihan</h3>
        ${Bill.itemsTable(b.items, canEdit)}
        ${canEdit ? `
        <div class="line-add">
          <div class="field"><label for="t-add">Tambah layanan dari master tarif</label>
            <select class="select" id="t-add"><option value="">Pilih layanan</option>${TARIF.map((x) => `<option value="${x.code}">${x.name} — ${U.rp(x.amount)}</option>`).join('')}</select></div>
          <button class="btn" type="button" id="t-btn">${U.icon('plus')} Tambah</button>
        </div>` : ''}
        <div class="total-row">
          <div class="chips-row">
            <span class="badge ${b.items.length ? 'b-ok' : 'b-bad'}">${b.items.length ? 'Complete' : 'Incomplete'}</span>
            <span class="badge ${noDup ? 'b-ok' : 'b-bad'}">${noDup ? 'No duplicate' : 'Duplicate item'}</span>
          </div>
          <div class="total"><span>Total</span><strong>${U.rp(total)}</strong></div>
        </div>
        ${selfPay ? '' : `<p class="note">Tagihan dijamin ${U.esc(b.payerName)}. Verifikasi kepesertaan dan pengajuan klaim diproses oleh Verifikator Penjamin di menu Penjamin.</p>`}
        <div class="actions"><a class="btn" href="#/billing">Kembali</a>${action}</div>
      </div>`;

    const addBtn = U.qs('#t-btn', el);
    if (addBtn) addBtn.addEventListener('click', () => {
      const code = U.qs('#t-add', el).value;
      if (!code) { UI.toast('Pilih layanan terlebih dahulu.', 'bad'); return; }
      const t = TARIF.find((x) => x.code === code);
      if (b.items.some((i) => i.code === code)) {
        UI.toast(`${t.name} sudah ada di tagihan → duplikat ditolak.`, 'bad');
        Store.audit({ module: 'Billing', activity: `Tambah layanan ditolak (duplikat): ${t.name} ${b.visit}`, result: 'Failed' });
        return;
      }
      b.items.push({ ...t }); Store.save();
      Store.audit({ module: 'Billing', activity: `Tambah layanan ${t.name} ke ${b.visit}` });
      UI.toast(`${t.name} ditambahkan (${U.rp(t.amount)}).`);
      Router.go(`billing/detail/${b.visit}`);
    });
    U.qsa('[data-rm]', el).forEach((btn) => btn.addEventListener('click', async () => {
      const it = b.items.find((i) => i.code === btn.dataset.rm);
      const ok = await UI.confirm('Hapus layanan', `Hapus <b>${U.esc(it.name)}</b> dari tagihan ${b.visit}?`, 'Hapus', true);
      if (!ok) return;
      b.items = b.items.filter((i) => i !== it); Store.save();
      Store.audit({ module: 'Billing', activity: `Hapus layanan ${it.name} dari ${b.visit}` });
      Router.go(`billing/detail/${b.visit}`);
    }));
    const gen = U.qs('#gen-inv', el);
    if (gen) gen.addEventListener('click', () => {
      if (!b.items.length) { UI.toast('Tagihan belum lengkap.', 'bad'); return; }
      const no = `INV-${U.ymd()}${U.pad(Store.next('invoice'), 3)}`;
      Store.db.invoices.push({ no, visit: b.visit, mrn: b.mrn, patient: b.patient, payer: b.payer, items: b.items.map((i) => ({ ...i })),
        total, status: 'Unpaid', createdAt: new Date().toISOString(), createdBy: user.name });
      b.status = 'Invoiced'; b.invoice = no; Store.save();
      Store.audit({ module: 'Billing', activity: `Generate invoice ${no} (${b.patient}, ${U.rp(total)})` });
      UI.toast(`Invoice ${no} dibuat — ${U.rp(total)}`);
      Router.go(`billing/payment?inv=${no}`);
    });
  },
});

/* ---------- Pembayaran self-pay ---------- */
Router.add('billing/payment', {
  perm: 'billing.payment', title: 'Pembayaran Self-Pay',
  render(el, { query }) {
    const unpaid = Store.db.invoices.filter((i) => i.status === 'Unpaid');
    const inv = Bill.invoice(query.inv) || unpaid[0];
    const head = C.pageHead('Pembayaran Self-Pay', 'Catat pembayaran dan perbarui status') + Bill.flow('Pembayaran');
    if (!inv) {
      el.innerHTML = head + `<div class="panel">${C.empty('Belum ada invoice yang menunggu pembayaran', 'Buka Daftar Tagihan, pilih tagihan self-pay berstatus Ready, lalu klik Generate Invoice.', '<a class="btn btn-primary" href="#/billing">Buka Daftar Tagihan</a>')}</div>`;
      return;
    }
    const paid = inv.status === 'Paid';
    el.innerHTML = `${head}
      <div class="panel">
        <div class="panel-top">
          <div class="field inline-field"><label for="p-inv">Invoice</label>
            <select class="select select-sm" id="p-inv">${[...new Set([inv, ...unpaid])].map((i) => `<option ${i.no === inv.no ? 'selected' : ''}>${i.no}</option>`).join('')}</select></div>
          <span class="badge b-ok">${inv.payer}</span>
        </div>
        <p class="muted">${U.esc(inv.patient)} &bull; ${inv.mrn} &bull; ${inv.visit}</p>
        <div class="label mt">Total Tagihan</div>
        <div class="big-amount">${U.rp(inv.total)}</div>
        <div class="form-grid mt">
          <div class="field"><label for="p-method">Metode Pembayaran *</label>
            <select class="select" id="p-method" ${paid ? 'disabled' : ''}>${['Cash', 'Debit', 'Kartu Kredit', 'QRIS', 'Transfer Bank'].map((m) => `<option ${inv.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
          <div class="field"><label for="p-amount">Nominal Pembayaran *</label>
            <input class="input" id="p-amount" inputmode="numeric" value="${U.rp(paid ? inv.amountPaid : inv.total)}" ${paid ? 'readonly' : ''}></div>
        </div>
        <div class="saldo-row">
          <div><div class="label">Saldo</div><div class="saldo" id="p-saldo"></div></div>
          <span class="badge" id="p-state"></span>
          <span class="muted" id="p-change"></span>
        </div>
        <div class="actions">
          <a class="btn" href="#/billing/detail/${inv.visit}">Kembali</a>
          ${paid ? `<a class="btn btn-primary" href="#/billing/invoice?inv=${inv.no}">Lihat Kuitansi</a>` : '<button class="btn btn-primary" id="p-save">Catat Pembayaran</button>'}
        </div>
      </div>`;
    const amountEl = U.qs('#p-amount', el);
    const parse = () => Number(String(amountEl.value).replace(/[^\d]/g, '')) || 0;
    const update = () => {
      const amt = paid ? inv.amountPaid : parse();
      const saldo = Math.max(inv.total - amt, 0);
      U.qs('#p-saldo', el).textContent = U.rp(saldo);
      U.qs('#p-saldo', el).classList.toggle('saldo-due', saldo > 0);
      const st = U.qs('#p-state', el);
      st.textContent = saldo === 0 ? 'LUNAS' : 'BELUM LUNAS';
      st.className = 'badge ' + (saldo === 0 ? 'b-ok' : 'b-warn');
      U.qs('#p-change', el).textContent = amt > inv.total ? `Kembalian ${U.rp(amt - inv.total)}` : '';
    };
    update();
    amountEl.addEventListener('input', update);
    amountEl.addEventListener('focus', () => { if (!paid) amountEl.select(); });
    amountEl.addEventListener('blur', () => { if (!paid) amountEl.value = U.rp(parse()); });
    U.qs('#p-inv', el).addEventListener('change', (e) => Router.go(`billing/payment?inv=${e.target.value}`));
    const save = U.qs('#p-save', el);
    if (save) save.addEventListener('click', () => {
      const amt = parse();
      if (amt < inv.total) {
        UI.toast(`Nominal kurang ${U.rp(inv.total - amt)} dari total tagihan → pembayaran ditolak.`, 'bad');
        Store.audit({ module: 'Billing', activity: `Record payment ${inv.no} ditolak: nominal kurang`, result: 'Failed' });
        amountEl.focus(); return;
      }
      inv.status = 'Paid'; inv.paidAt = new Date().toISOString();
      inv.method = U.qs('#p-method', el).value; inv.amountPaid = amt; inv.change = amt - inv.total;
      const b = Bill.bill(inv.visit); if (b) b.status = 'Paid';
      Store.save();
      Store.audit({ module: 'Billing', activity: `Record payment ${inv.no} (${inv.method}, ${U.rp(amt)})` });
      UI.toast(`Pembayaran ${inv.no} tercatat — LUNAS`);
      Router.go(`billing/invoice?inv=${inv.no}`);
    });
  },
});

/* ---------- Invoice / kuitansi ---------- */
Router.add('billing/invoice', {
  perm: 'billing.invoice', title: 'Invoice / Kuitansi',
  render(el, { query }) {
    const all = [...Store.db.invoices].reverse();
    const inv = Bill.invoice(query.inv) || all[0];
    const head = C.pageHead('Invoice / Kuitansi', 'Cetak atau kirim dokumen transaksi') + Bill.flow('Kuitansi');
    if (!inv) { el.innerHTML = head + `<div class="panel">${C.empty('Belum ada invoice', 'Invoice muncul setelah tagihan di-generate.', '<a class="btn btn-primary" href="#/billing">Buka Daftar Tagihan</a>')}</div>`; return; }
    const paid = inv.status === 'Paid';
    el.innerHTML = `${head}
      <div class="toolbar toolbar-plain no-print">
        <div class="field inline-field"><label for="i-sel">Pilih invoice</label>
          <select class="select select-sm" id="i-sel">${all.map((i) => `<option value="${i.no}" ${i.no === inv.no ? 'selected' : ''}>${i.no} — ${U.esc(i.patient)}</option>`).join('')}</select></div>
      </div>
      <div class="panel print-area">
        <div class="inv-head">
          <div><h2 class="inv-title">${paid ? 'KUITANSI' : 'INVOICE'}</h2>
            <p class="muted">${U.esc(inv.patient)} &bull; ${inv.mrn} &bull; ${inv.visit}<br>Tanggal: ${U.dateTime(inv.createdAt)} &bull; Kasir: ${U.esc(inv.createdBy)}</p></div>
          <div class="inv-org"><strong>RS PERMATA MEDIKA</strong><span>${inv.no}</span>${paid ? '<span class="stamp">LUNAS</span>' : C.statusPill('Unpaid')}</div>
        </div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Description</th><th>Qty</th><th class="num">Amount</th></tr></thead>
          <tbody>${inv.items.map((i) => `<tr><td>${U.esc(i.cat)} — ${U.esc(i.name)}</td><td>1</td><td class="num">${U.num(i.amount)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="total-row"><div>${paid ? `<p class="muted">Dibayar ${U.dateTime(inv.paidAt)} via ${U.esc(inv.method)} — ${U.rp(inv.amountPaid)}${inv.change ? `, kembalian ${U.rp(inv.change)}` : ''}</p>` : ''}</div>
          <div class="total"><span>TOTAL</span><strong>${U.rp(inv.total)}</strong></div></div>
        <div class="actions no-print">
          ${paid ? '' : `<a class="btn" href="#/billing/payment?inv=${inv.no}">Ke Pembayaran</a>`}
          <button class="btn btn-primary" id="i-print">Print ${paid ? 'Kuitansi' : 'Invoice'}</button>
          <button class="btn" id="i-send">Send</button>
        </div>
      </div>`;
    U.qs('#i-sel', el).addEventListener('change', (e) => Router.go(`billing/invoice?inv=${e.target.value}`));
    U.qs('#i-print', el).addEventListener('click', () => {
      Store.audit({ module: 'Billing', activity: `Print ${paid ? 'receipt' : 'invoice'} ${inv.no}` });
      UI.toast(`${inv.no} dikirim ke printer`, 'info');
      try { window.print(); } catch (e) { /* pencetakan diblokir browser */ }
    });
    U.qs('#i-send', el).addEventListener('click', async () => {
      const email = await UI.modal({
        title: 'Kirim dokumen',
        body: '<div class="field"><label for="m-email">Email pasien</label><input class="input" id="m-email" type="email" placeholder="nama@email.com"></div>',
        actions: [{ label: 'Batal', cls: 'btn', value: null }, { label: 'Send', cls: 'btn btn-primary', value: (r) => U.qs('#m-email', r).value.trim() }],
        onOpen: (r) => setTimeout(() => U.qs('#m-email', r).focus(), 0),
      });
      if (email === null) return;
      if (!/^\S+@\S+\.\S+$/.test(email)) { UI.toast('Alamat email tidak valid.', 'bad'); return; }
      Store.audit({ module: 'Billing', activity: `Send ${inv.no} to ${email}` });
      UI.toast(`${inv.no} dikirim ke ${email}`);
    });
  },
});

/* ---------- Verifikasi penjamin ---------- */
Router.add('penjamin/verify', {
  perm: 'penjamin.verify', title: 'Verifikasi Penjamin',
  render(el, { query, user }) {
    const list = Store.db.bills.filter((b) => b.payer !== 'Self-Pay');
    const b = Bill.bill(query.visit) || list.find((x) => ['Verify', 'Pending'].includes(x.status)) || list[0];
    const head = C.pageHead('Verifikasi Penjamin', 'Status kepesertaan dan hak layanan');
    if (!b) { el.innerHTML = head + `<div class="panel">${C.empty('Tidak ada kunjungan dengan penjamin', 'Semua kunjungan saat ini self-pay.')}</div>`; return; }
    const total = Bill.total(b.items);
    const done = ['Verified', 'Claim Submitted'].includes(b.status);
    const state = done ? 'valid' : Bill.checked[b.visit] || 'unchecked';
    const fmt = b.payer === 'BPJS' ? '13 digit angka' : 'POL- diikuti 8 digit';
    el.innerHTML = `${head}
      <div class="flow-hint">Alur: <b>Cek kepesertaan</b> → Set payer → Ajukan klaim</div>
      <div class="toolbar toolbar-plain">
        <div class="field inline-field"><label for="v-sel">Kunjungan</label>
          <select class="select select-sm" id="v-sel">${list.map((x) => `<option value="${x.visit}" ${x.visit === b.visit ? 'selected' : ''}>${U.esc(x.patient)} — ${x.payer} (${x.status})</option>`).join('')}</select></div>
      </div>
      <div class="panel">
        <h2 class="panel-title">${U.esc(b.patient)} &bull; ${b.mrn} &bull; ${b.visit}</h2>
        <div class="form-grid">
          <div class="field"><label>Payer / Insurance</label><input class="input" value="${U.esc(b.payerName)}" readonly></div>
          <div class="field"><label for="v-no">Nomor Kepesertaan <span class="muted">(${fmt})</span></label>
            <div class="input-group"><input class="input" id="v-no" value="${U.esc(b.memberNo || '')}" ${done ? 'readonly' : ''} inputmode="${b.payer === 'BPJS' ? 'numeric' : 'text'}">
            ${done ? '' : '<button type="button" class="btn" id="v-check">Cek</button>'}</div></div>
        </div>
        <div class="field mt"><span class="label">Hasil Verifikasi</span><div class="verify-row" id="v-result"></div></div>
        <div class="form-grid mt">
          <div class="field"><label>Tanggungan Penjamin</label><input class="input" value="${U.rp(total - b.patientShare)}" readonly></div>
          <div class="field"><label>Tanggungan Pasien</label><input class="input" value="${U.rp(b.patientShare)}" readonly></div>
        </div>
        <p class="note">Total tagihan ${U.rp(total)}. Status tagihan: ${C.statusPill(b.status)}</p>
        <div class="actions">
          ${done ? `<a class="btn btn-primary" href="#/penjamin/claim?visit=${b.visit}">Buka Pengajuan Klaim</a>` : '<button class="btn btn-primary" id="v-save">Set Payer &amp; Simpan</button>'}
        </div>
      </div>`;
    const showResult = (s) => {
      U.qs('#v-result', el).innerHTML = {
        valid: '<span class="badge b-ok">VALID</span><strong class="ok-text">Kepesertaan aktif &bull; hak layanan sesuai</strong>',
        invalid: '<span class="badge b-bad">TIDAK VALID</span><strong class="bad-text">Nomor kepesertaan tidak ditemukan / tidak aktif</strong>',
        unchecked: '<span class="badge b-muted">BELUM DICEK</span><span class="muted">Klik Cek untuk memverifikasi kepesertaan.</span>',
      }[s];
    };
    showResult(state);
    U.qs('#v-sel', el).addEventListener('change', (e) => Router.go(`penjamin/verify?visit=${e.target.value}`));
    if (done) return;
    const noEl = U.qs('#v-no', el);
    noEl.addEventListener('input', () => { Bill.checked[b.visit] = 'unchecked'; showResult('unchecked'); });
    U.qs('#v-check', el).addEventListener('click', () => {
      const ok = Bill.isValidMember(b, noEl.value.trim());
      Bill.checked[b.visit] = ok ? 'valid' : 'invalid';
      showResult(Bill.checked[b.visit]);
      Store.audit({ module: 'Penjamin', activity: `Check eligibility ${b.visit} (${ok ? 'valid' : 'tidak valid'})`, result: ok ? 'Success' : 'Failed' });
    });
    U.qs('#v-save', el).addEventListener('click', () => {
      if (Bill.checked[b.visit] !== 'valid') { UI.toast('Kepesertaan harus VALID sebelum disimpan. Klik Cek terlebih dahulu.', 'bad'); return; }
      b.memberNo = noEl.value.trim(); b.status = 'Verified';
      b.verifiedAt = new Date().toISOString(); b.verifiedBy = user.name; Store.save();
      Store.audit({ module: 'Penjamin', activity: `Verify payer ${b.payer} ${b.visit} (${b.patient})` });
      UI.toast(`Penjamin ${b.payerName} untuk ${b.patient} tersimpan.`);
      Router.go(`penjamin/claim?visit=${b.visit}`);
    });
  },
});

/* ---------- Pengajuan klaim ---------- */
Router.add('penjamin/claim', {
  perm: 'penjamin.claim', title: 'Pengajuan Klaim',
  render(el, { query, user }) {
    const ready = Store.db.bills.filter((b) => b.status === 'Verified');
    const b = ready.find((x) => x.visit === query.visit) || ready[0];
    const claims = [...Store.db.claims].reverse();
    const history = `
      <section class="section">
        <h2 class="section-title">Klaim terkirim</h2>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>No. Klaim</th><th>Pasien</th><th>Payer</th><th class="num">Nilai klaim</th><th>Waktu pengajuan</th><th>Status</th></tr></thead>
          <tbody>${claims.map((c) => `<tr><td class="nowrap">${c.no}</td><td>${U.esc(c.patient)}</td><td>${U.esc(c.payer)}</td><td class="num">${U.num(c.amount)}</td><td class="nowrap">${U.dateTime(c.submittedAt)}</td><td>${C.statusPill(c.status)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted center">Belum ada klaim.</td></tr>'}</tbody>
        </table></div>
      </section>`;
    const head = C.pageHead('Pengajuan Klaim', 'Submit klaim setelah verifikasi penjamin') + '<div class="flow-hint">Alur: Cek kepesertaan → Set payer → <b>Ajukan klaim</b></div>';
    const done = query.done && Store.db.claims.find((c) => c.no === query.done);
    if (!b && done) {
      el.innerHTML = head + `<div class="panel"><div class="empty"><span class="badge b-ok">SUBMITTED</span><h3 class="mt-s">Klaim ${done.no} berhasil diajukan</h3><p>${U.esc(done.patient)} &bull; ${U.esc(done.payer)} &bull; nilai klaim ${U.rp(done.amount)} &bull; ${U.dateTime(done.submittedAt)}</p><a class="btn" href="#/penjamin/verify">Verifikasi kunjungan lain</a></div></div>` + history;
      return;
    }
    if (!b) {
      el.innerHTML = head + `<div class="panel">${C.empty('Belum ada klaim yang siap diajukan', 'Klaim hanya bisa diajukan setelah penjamin diverifikasi VALID.', '<a class="btn btn-primary" href="#/penjamin/verify">Buka Verifikasi Penjamin</a>')}</div>` + history;
      return;
    }
    const total = Bill.total(b.items), payerShare = total - b.patientShare;
    el.innerHTML = `${head}
      ${ready.length > 1 ? `<div class="toolbar toolbar-plain"><div class="field inline-field"><label for="c-sel">Kunjungan</label>
        <select class="select select-sm" id="c-sel">${ready.map((x) => `<option value="${x.visit}" ${x.visit === b.visit ? 'selected' : ''}>${U.esc(x.patient)} — ${x.payer}</option>`).join('')}</select></div></div>` : ''}
      <div class="panel">
        <h2 class="panel-title">Ringkasan Klaim</h2>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Field</th><th>Value</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Pasien</td><td>${U.esc(b.patient)} (${b.mrn})</td><td>Verified</td></tr>
            <tr><td>Payer</td><td>${U.esc(b.payerName)} — ${U.esc(b.memberNo)}</td><td>Valid</td></tr>
            <tr><td>Total tagihan</td><td>${U.rp(total)}</td><td>Calculated</td></tr>
            <tr><td>Tanggungan pasien</td><td>${U.rp(b.patientShare)}</td><td>Calculated</td></tr>
            <tr><td>Nilai klaim (tanggungan payer)</td><td>${U.rp(payerShare)}</td><td>Calculated</td></tr>
          </tbody>
        </table></div>
        <div class="chips-row mt"><span class="badge b-info">READY TO SUBMIT</span></div>
        <p class="note">Nomor klaim, status, dan waktu pengajuan tersimpan.</p>
        <div class="actions"><button class="btn btn-primary" id="c-submit">Submit Klaim</button></div>
      </div>
      ${history}`;
    const sel = U.qs('#c-sel', el);
    if (sel) sel.addEventListener('change', (e) => Router.go(`penjamin/claim?visit=${e.target.value}`));
    U.qs('#c-submit', el).addEventListener('click', async () => {
      const ok = await UI.confirm('Submit Klaim', `Ajukan klaim ${U.esc(b.payerName)} senilai <b>${U.rp(payerShare)}</b> untuk ${U.esc(b.patient)}?`, 'Submit Klaim');
      if (!ok) return;
      const no = `KLM-${U.ymd()}${U.pad(Store.next('claim'), 3)}`;
      Store.db.claims.push({ no, visit: b.visit, patient: b.patient, payer: b.payerName, amount: payerShare, submittedAt: new Date().toISOString(), submittedBy: user.name, status: 'Submitted' });
      b.status = 'Claim Submitted'; b.claimNo = no; Store.save();
      Store.audit({ module: 'Penjamin', activity: `Submit claim ${no} (${b.patient}, ${U.rp(payerShare)})` });
      UI.toast(`Klaim ${no} berhasil diajukan.`);
      Router.go(`penjamin/claim?done=${no}`);
    });
  },
});

/* ---------- Laporan billing ---------- */
Router.add('reports', {
  perm: 'reports.billing', title: 'Laporan Billing',
  render(el) {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    const st = Bill.report || (Bill.report = { tab: 'trx', from: U.isoDay(weekAgo), to: U.isoDay() });
    const inRange = (iso) => { const d = U.isoDay(new Date(iso)); return (!st.from || d >= st.from) && (!st.to || d <= st.to); };
    const trx = [];
    Store.db.invoices.forEach((i) => {
      trx.push({ ts: i.createdAt, doc: i.no, type: 'Invoice', patient: i.patient, payer: i.payer, amount: i.total, status: i.status === 'Paid' ? 'Paid' : 'Unpaid' });
      if (i.status === 'Paid') trx.push({ ts: i.paidAt, doc: i.no, type: 'Pembayaran', patient: i.patient, payer: `${i.payer} (${i.method})`, amount: i.total, status: 'Paid' });
    });
    Store.db.claims.forEach((c) => trx.push({ ts: c.submittedAt, doc: c.no, type: 'Klaim', patient: c.patient, payer: c.payer, amount: c.amount, status: c.status }));
    const rows = trx.filter((r) => inRange(r.ts)).sort((a, b) => b.ts.localeCompare(a.ts));
    const sum = (type) => rows.filter((r) => r.type === type).reduce((s, r) => s + r.amount, 0);
    const audit = Store.db.audit.filter((a) => inRange(a.ts));

    el.innerHTML = `
      ${C.pageHead('Laporan Billing', 'Rekap transaksi kasir & klaim penjamin')}
      <div class="panel">
        <div class="tabs">
          <button type="button" class="chip ${st.tab === 'trx' ? 'chip-on' : ''}" data-tab="trx" aria-pressed="${st.tab === 'trx'}">Transaksi</button>
          <button type="button" class="chip ${st.tab === 'audit' ? 'chip-on' : ''}" data-tab="audit" aria-pressed="${st.tab === 'audit'}">Audit Trail</button>
        </div>
        <div class="form-grid">
          <div class="field"><span class="label">Date Range</span>
            <div class="date-range"><input class="input" type="date" id="r-from" value="${st.from}" aria-label="Dari tanggal"><span>–</span><input class="input" type="date" id="r-to" value="${st.to}" aria-label="Sampai tanggal"></div></div>
        </div>
        <div class="actions actions-tight">
          ${APP.allowDownload ? '<button class="btn" id="r-csv">Unduh CSV</button>' : ''}
          <button class="btn btn-primary" id="r-gen">Generate Report</button>
        </div>
        ${st.tab === 'trx' ? `
        <div class="sum-row mt">
          <div class="sum"><span>Nilai invoice</span><strong>${U.rp(sum('Invoice'))}</strong></div>
          <div class="sum"><span>Penerimaan kas</span><strong>${U.rp(sum('Pembayaran'))}</strong></div>
          <div class="sum"><span>Klaim diajukan</span><strong>${U.rp(sum('Klaim'))}</strong></div>
          <div class="sum"><span>Jumlah transaksi</span><strong>${rows.length}</strong></div>
        </div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Waktu</th><th>No. Dokumen</th><th>Jenis</th><th>Pasien</th><th>Payer / Metode</th><th class="num">Nilai</th><th>Status</th></tr></thead>
          <tbody>${rows.map((r) => `<tr><td class="nowrap">${U.dateTime(r.ts)}</td><td class="nowrap">${r.doc}</td><td>${C.statusPill(r.type)}</td><td>${U.esc(r.patient)}</td><td>${U.esc(r.payer)}</td><td class="num">${U.num(r.amount)}</td><td>${C.statusPill(r.status)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted center">Tidak ada transaksi pada rentang ini.</td></tr>'}</tbody>
        </table></div>` : `
        <div class="report-head"><span class="label">Activity</span><span class="muted">${audit.length} aktivitas</span></div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Time</th><th>User</th><th>Role</th><th>Module</th><th>Activity</th><th>Result</th></tr></thead>
          <tbody>${audit.map((a) => `<tr><td class="nowrap">${U.dateTime(a.ts)}</td><td>${U.esc(a.user)}</td><td>${U.esc(a.role)}</td><td>${U.esc(a.module)}</td><td>${U.esc(a.activity)}</td><td>${C.statusPill(a.result)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted center">Tidak ada aktivitas.</td></tr>'}</tbody>
        </table></div>`}
      </div>`;
    U.qsa('[data-tab]', el).forEach((b) => b.addEventListener('click', () => { st.tab = b.dataset.tab; Router.go('reports'); }));
    U.qs('#r-gen', el).addEventListener('click', () => {
      st.from = U.qs('#r-from', el).value; st.to = U.qs('#r-to', el).value;
      Store.audit({ module: 'Reports', activity: `Generate laporan billing (${st.tab === 'trx' ? 'transaksi' : 'audit trail'})` });
      UI.toast('Laporan diperbarui.', 'info');
      Router.go('reports');
    });
    const csv = U.qs('#r-csv', el);
    if (csv) csv.addEventListener('click', () => {
      if (st.tab === 'trx') U.downloadCsv(`laporan-billing-${st.from}_${st.to}.csv`, ['Tanggal', 'Waktu', 'No. Dokumen', 'Jenis', 'Pasien', 'Payer', 'Nilai', 'Status'], rows.map((r) => [U.date(r.ts), U.time(r.ts), r.doc, r.type, r.patient, r.payer, r.amount, r.status]));
      else U.downloadCsv(`audit-billing-${st.from}_${st.to}.csv`, ['Tanggal', 'Waktu', 'User', 'Role', 'Module', 'Activity', 'Result'], audit.map((a) => [U.date(a.ts), U.time(a.ts), a.user, a.role, a.module, a.activity, a.result]));
      Store.audit({ module: 'Reports', activity: 'Export laporan billing CSV' });
    });
  },
});

</script>
<script>
/* ==== shared/shell.js ==== */
/* =========================================================
   shell.js : layout utama, sidebar dinamis (RBAC), topbar,
              route guard (403), logout, dan boot aplikasi
              (dipakai bersama oleh ketiga aplikasi)
   ========================================================= */

const App = {
  root: null,

  /* ---- Sidebar: hanya menu yang diizinkan untuk role yang login ---- */
  sidebar(user, path, allowed = true) {
    const menu = Auth.visibleMenu();
    const items = menu.map((m) => {
      // sub-menu aktif = rute terpanjang yang cocok dengan URL sekarang
      const best = (m.children || [])
        .filter((c) => path === c.route || (allowed && path.startsWith(c.route + '/')))
        .sort((a, b) => b.route.length - a.route.length)[0];
      const active = m.route ? (path === m.route || (allowed && path.startsWith(m.route + '/'))) : !!best;
      const href = '#/' + Auth.firstRoute(m);
      const subs = m.children && active ? `<div class="sub">${m.children.map((c) =>
        `<a href="#/${c.route}" class="${c === best ? 'active' : ''}" ${c === best ? 'aria-current="page"' : ''}>${c.label}</a>`).join('')}</div>` : '';
      return `<a href="${href}" class="${active ? 'active' : ''}" ${active && !subs ? 'aria-current="page"' : ''}>${U.icon(m.icon)}<span>${m.label}</span></a>${subs}`;
    }).join('');

    const keys = menu.map((m) => m.key);
    const comps = COMPONENTS.filter((c) => c.modules.some((k) => keys.includes(k)))
      .map((c) => `<div class="comp">${c.label}</div>`).join('');

    return `
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-top">${U.icon('menu')}<span>SIMRS</span></div>
          <div class="brand-sub">RS PERMATA MEDIKA</div>
          <div class="brand-mod">Modul ${U.esc(APP.module)}</div>
        </div>
        <div class="nav-label">MENU</div>
        <nav class="nav" aria-label="Menu utama">${items}</nav>
        ${comps ? `<div class="nav-label">COMPONENTS</div><div class="comps">${comps}</div>` : ''}
        <div class="side-foot">
          <div class="side-role">${ROLES[user.role].label}</div>
          <div class="side-user">${U.esc(user.name)} &middot; ${U.esc(user.username)}</div>
          <button type="button" class="side-logout" data-logout>${U.icon('logout')}Logout</button>
        </div>
      </aside>`;
  },

  topbar(user) {
    return `
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Buka menu">${U.icon('menu')}</button>
        <div class="top-title"><span class="t-long">SIMRS | ${U.esc(APP.moduleLong)}</span><span class="t-short">${U.esc(APP.module)}</span></div>
        <div class="top-search">
          ${U.icon('search')}<input id="top-search" placeholder="Search" autocomplete="off" aria-label="Cari menu">
          <div class="search-drop" id="search-drop" hidden></div>
        </div>
        <div class="top-clock" title="Login sejak ${U.time(Session.get().loginAt)}">${U.icon('clock')}<span id="clock"></span></div>
        <div class="avatar-wrap">
          <button type="button" class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false">${U.initials(user.name)}</button>
          <div class="avatar-menu" id="avatar-menu" hidden>
            <strong>${U.esc(user.name)}</strong>
            <span>${ROLES[user.role].label}</span>
            <span class="muted">${user.id} &middot; ${U.esc(user.unit)}</span>
            <span class="muted">Login ${U.time(Session.get().loginAt)}</span>
            <button type="button" class="btn btn-sm" data-logout>Logout</button>
          </div>
        </div>
      </header>`;
  },

  /* ---- Navigasi bawah (khusus HP): hanya modul milik role ---- */
  bottomNav(path, allowed) {
    const items = Auth.visibleMenu().map((m) => {
      const r = Auth.firstRoute(m);
      const on = m.route ? path === m.route || (allowed && path.startsWith(m.route + '/'))
        : allowed && (m.children || []).some((c) => path === c.route || path.startsWith(c.route + '/'));
      const short = m.short || m.label;
      return `<a href="#/${r}" class="${on ? 'active' : ''}" ${on ? 'aria-current="page"' : ''}>${U.icon(m.icon)}<span>${short}</span></a>`;
    }).join('');
    return `<nav class="bottom-nav" aria-label="Navigasi modul">${items}<button type="button" data-logout>${U.icon('logout')}<span>Logout</span></button></nav>`;
  },

  /* ---- Beri label kolom pada setiap sel tabel (dipakai tampilan kartu di HP) ---- */
  labelTables(root) {
    U.qsa('table.tbl', root).forEach((t) => {
      const heads = U.qsa('thead th', t).map((th) => th.textContent.trim());
      U.qsa('tbody tr', t).forEach((tr) => U.qsa('td', tr).forEach((td, i) => {
        if (!td.hasAttribute('colspan') && heads[i] !== undefined && td.dataset.label !== heads[i]) td.dataset.label = heads[i];
      }));
    });
  },

  /* ---- Halaman 403: role tidak punya izin ---- */
  forbidden(el, user, path) {
    el.innerHTML = `
      <div class="panel forbidden">
        <div class="forbidden-icon">${U.icon('lock')}</div>
        <h1>403 — Akses ditolak</h1>
        <p>Role <b>${ROLES[user.role].label}</b> tidak memiliki izin untuk membuka halaman <code>/${U.esc(path)}</code>.</p>
        <p class="muted">Percobaan akses ini dicatat pada audit trail.</p>
        <a class="btn btn-primary" href="#/dashboard">Kembali ke Dashboard</a>
      </div>`;
  },

  async logoutFlow() {
    const ok = await UI.modal({
      title: 'Logout',
      body: '<p class="center">Apakah Anda yakin ingin mengakhiri sesi?</p><p class="center muted small">Session diakhiri dan waktu logout dicatat.</p>',
      actions: [{ label: 'Batal', cls: 'btn', value: false }, { label: 'Logout', cls: 'btn btn-primary', value: true }],
    });
    if (!ok) return;
    Auth.logout();
    if (APP.onLogout) APP.onLogout();
    UI.toast(`Sesi diakhiri pukul ${U.time(new Date().toISOString())}.`);
    Router.go('login');
  },

  bindShell(user) {
    U.qsa('[data-logout]').forEach((b) => b.addEventListener('click', () => App.logoutFlow()));

    const sb = U.qs('#sidebar');
    U.qs('#menu-btn').addEventListener('click', () => sb.classList.toggle('open'));
    U.qs('#drawer-bd').addEventListener('click', () => sb.classList.remove('open'));
    U.qsa('#sidebar a').forEach((a) => a.addEventListener('click', () => sb.classList.remove('open')));

    const av = U.qs('#avatar'), am = U.qs('#avatar-menu');
    av.addEventListener('click', (e) => { e.stopPropagation(); am.hidden = !am.hidden; av.setAttribute('aria-expanded', String(!am.hidden)); });

    // Pencarian menu — menu yang boleh diakses tampil di atas; menu role lain ditandai terkunci (klik → 403)
    const input = U.qs('#top-search'), drop = U.qs('#search-drop');
    const leafOf = (m) => m.children ? m.children.map((c) => ({ label: c.label, group: m.label, route: c.route, perm: c.perm })) : [{ label: m.label, group: '', route: m.route, perm: m.perm }];
    const allLeaves = MENU.flatMap(leafOf);
    const leaves = allLeaves.filter((l) => Auth.can(l.perm));
    const locked = allLeaves.filter((l) => !Auth.can(l.perm));
    const match = (l, q) => !q || (l.label + ' ' + l.group).toLowerCase().includes(q);
    const show = () => {
      const q = input.value.trim().toLowerCase();
      const hits = leaves.filter((l) => match(l, q)).slice(0, 8);
      const lockedHits = q ? locked.filter((l) => match(l, q)).slice(0, 4) : [];
      drop.innerHTML = hits.map((h) => `<a href="#/${h.route}">${h.label}${h.group && h.group !== h.label ? `<small>${h.group}</small>` : ''}</a>`).join('')
        + (lockedHits.length ? `<div class="drop-group">Tidak ada akses untuk role ini</div>${lockedHits.map((h) => `<a href="#/${h.route}" class="locked">${U.icon('lock')}${h.label}${h.group && h.group !== h.label ? `<small>${h.group}</small>` : ''}</a>`).join('')}` : '')
        || '<div class="muted small pad">Tidak ada menu yang cocok.</div>';
      drop.hidden = false;
    };
    drop.addEventListener('pointerdown', (e) => e.preventDefault()); // jaga fokus agar tap di HP tidak hilang
    input.addEventListener('focus', show);
    input.addEventListener('input', show);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const a = U.qs('a', drop); if (a) { input.blur(); Router.go(a.getAttribute('href').slice(2)); } }
      if (e.key === 'Escape') input.blur();
    });
    input.addEventListener('blur', () => setTimeout(() => { drop.hidden = true; }, 200));
    App.tick();
  },

  tick() {
    const c = document.getElementById('clock');
    if (!c) return;
    const d = new Date();
    c.textContent = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
  },

  /* ---- Render utama setiap kali URL (hash) berubah ---- */
  render() {
    const root = App.root;
    const { path, query } = Router.parse();
    let user = Auth.user();

    // akun dinonaktifkan saat sedang login -> paksa logout
    if (user && user.status !== 'Active') {
      Auth.logout('Forced logout: akun nonaktif');
      user = null;
      root.dataset.view = '';
      Router.replace('login');
      renderLogin(root, 'Akun Anda telah dinonaktifkan. Hubungi Admin SIMRS.');
      return;
    }

    if (!user) {
      if (path !== 'login') Router.replace('login');
      root.dataset.view = 'login';
      document.title = `Sign in · SIMRS ${APP.module}`;
      renderLogin(root);
      return;
    }
    if (path === 'login' || path === '') { Router.replace('dashboard'); return App.render(); }

    // password sementara (akun baru / hasil reset) wajib diganti sebelum memakai sistem
    if (user.mustChange && typeof renderFirstPassword === 'function') {
      root.dataset.view = 'login';
      document.title = `Buat password baru · SIMRS ${APP.module}`;
      renderFirstPassword(root, user);
      return;
    }

    const m = Router.match(path);
    const allowed = !!m && Auth.can(m.route.perm);
    root.dataset.view = 'app';
    root.innerHTML = `<div class="shell">${App.sidebar(user, path, allowed)}<div class="drawer-backdrop" id="drawer-bd"></div><div class="main">${App.topbar(user)}<main class="view" id="view" tabindex="-1"></main></div></div>${App.bottomNav(path, allowed)}`;
    App.bindShell(user);
    const view = U.qs('#view');

    if (!m) {
      view.innerHTML = `<div class="panel">${C.empty('Halaman tidak ditemukan', `Alamat <code>/${U.esc(path)}</code> tidak ada.`, '<a class="btn btn-primary" href="#/dashboard">Kembali ke Dashboard</a>')}</div>`;
      document.title = `Tidak ditemukan · SIMRS ${APP.module}`;
    } else if (!allowed) {
      App.forbidden(view, user, path);
      Store.audit({ module: 'RBAC', activity: `Akses ditolak ke /${path}`, result: 'Denied' });
      document.title = `Akses ditolak · SIMRS ${APP.module}`;
    } else {
      m.route.render(view, { params: m.params, query, user });
      document.title = `${m.route.title} · SIMRS ${APP.module}`;
    }
    window.scrollTo(0, 0);
  },

  boot() {
    App.root = document.getElementById('root');
    Store.load();
    Router.current = Router.read() || '';
    window.addEventListener('hashchange', () => Router.onHashChange());
    // semua link internal (#/...) ditangani router, tidak bergantung pada navigasi browser
    document.addEventListener('click', (e) => {
      const a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
      if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      Router.go(a.getAttribute('href').slice(2));
    });
    // sinkronisasi bila data diubah dari tab lain (mis. login role lain di tab berbeda)
    window.addEventListener('storage', (e) => { if (e.key === APP.storeKey) { Store.load(); if (App.root.dataset.view === 'app') App.render(); } });
    // label tabel otomatis setiap kali isi halaman berubah
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; App.labelTables(App.root); });
    }).observe(App.root, { childList: true, subtree: true });
    // tutup menu avatar saat klik di luar
    document.addEventListener('click', (e) => {
      const am = document.getElementById('avatar-menu');
      if (am && !am.hidden && !am.contains(e.target)) { am.hidden = true; U.qs('#avatar').setAttribute('aria-expanded', 'false'); }
    });
    setInterval(App.tick, 20000);
    App.render();
  },
};

App.boot();

</script>
</body>
</html>
