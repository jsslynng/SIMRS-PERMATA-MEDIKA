      st.from = U.qs('#r-from', el).value; st.to = U.qs('#r-to', el).value;
      Store.audit({ module: 'Reports', activity: `Generate laporan inventory (${st.tab === 'moves' ? 'pergerakan stok' : 'audit trail'})` });
      UI.toast('Laporan diperbarui.', 'info');
      Router.go('reports');
    });
    const csv = U.qs('#r-csv', el);
    if (csv) csv.addEventListener('click', () => {
      if (st.tab === 'moves') U.downloadCsv(`laporan-inventory-${st.from}_${st.to}.csv`, ['Tanggal', 'Waktu', 'No. Ref', 'Kode', 'Item', 'Jenis', 'Masuk', 'Keluar', 'Saldo', 'Oleh'], rows.map((m) => [U.date(m.ts), U.time(m.ts), m.ref, m.code, Inv.item(m.code).name, m.type, m.qin, m.qout, m.balance, m.by]));
      else U.downloadCsv(`audit-inventory-${st.from}_${st.to}.csv`, ['Tanggal', 'Waktu', 'User', 'Role', 'Module', 'Activity', 'Result'], audit.map((a) => [U.date(a.ts), U.time(a.ts), a.user, a.role, a.module, a.activity, a.result]));
      Store.audit({ module: 'Reports', activity: 'Export laporan inventory CSV' });
    });
  },
});

</script>
<script>
/* ==== shared/shell.js ==== */
/* =========================================================
   shell.js : layout utama, sidebar dinamis (RBAC), topbar,
              route guard (403), logout, dan boot aplikasi
              (dipakai bersama oleh ketiga aplikasi)
   ========================================================= */

const App = {
  root: null,

  /* ---- Sidebar: hanya menu yang diizinkan untuk role yang login ---- */
  sidebar(user, path, allowed = true) {
    const menu = Auth.visibleMenu();
    const items = menu.map((m) => {
      // sub-menu aktif = rute terpanjang yang cocok dengan URL sekarang
      const best = (m.children || [])
        .filter((c) => path === c.route || (allowed && path.startsWith(c.route + '/')))
        .sort((a, b) => b.route.length - a.route.length)[0];
      const active = m.route ? (path === m.route || (allowed && path.startsWith(m.route + '/'))) : !!best;
      const href = '#/' + Auth.firstRoute(m);
      const subs = m.children && active ? `<div class="sub">${m.children.map((c) =>
        `<a href="#/${c.route}" class="${c === best ? 'active' : ''}" ${c === best ? 'aria-current="page"' : ''}>${c.label}</a>`).join('')}</div>` : '';
      return `<a href="${href}" class="${active ? 'active' : ''}" ${active && !subs ? 'aria-current="page"' : ''}>${U.icon(m.icon)}<span>${m.label}</span></a>${subs}`;
    }).join('');

    const keys = menu.map((m) => m.key);
    const comps = COMPONENTS.filter((c) => c.modules.some((k) => keys.includes(k)))
      .map((c) => `<div class="comp">${c.label}</div>`).join('');

    return `
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-top">${U.icon('menu')}<span>SIMRS</span></div>
          <div class="brand-sub">RS PERMATA MEDIKA</div>
          <div class="brand-mod">Modul ${U.esc(APP.module)}</div>
        </div>
        <div class="nav-label">MENU</div>
        <nav class="nav" aria-label="Menu utama">${items}</nav>
        ${comps ? `<div class="nav-label">COMPONENTS</div><div class="comps">${comps}</div>` : ''}
        <div class="side-foot">
          <div class="side-role">${ROLES[user.role].label}</div>
          <div class="side-user">${U.esc(user.name)} &middot; ${U.esc(user.username)}</div>
          <button type="button" class="side-logout" data-logout>${U.icon('logout')}Logout</button>
        </div>
      </aside>`;
  },

  topbar(user) {
    return `
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Buka menu">${U.icon('menu')}</button>
        <div class="top-title"><span class="t-long">SIMRS | ${U.esc(APP.moduleLong)}</span><span class="t-short">${U.esc(APP.module)}</span></div>
        <div class="top-search">
          ${U.icon('search')}<input id="top-search" placeholder="Search" autocomplete="off" aria-label="Cari menu">
          <div class="search-drop" id="search-drop" hidden></div>
        </div>
        <div class="top-clock" title="Login sejak ${U.time(Session.get().loginAt)}">${U.icon('clock')}<span id="clock"></span></div>
        <div class="avatar-wrap">
          <button type="button" class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false">${U.initials(user.name)}</button>
          <div class="avatar-menu" id="avatar-menu" hidden>
            <strong>${U.esc(user.name)}</strong>
            <span>${ROLES[user.role].label}</span>
            <span class="muted">${user.id} &middot; ${U.esc(user.unit)}</span>
            <span class="muted">Login ${U.time(Session.get().loginAt)}</span>
            <button type="button" class="btn btn-sm" data-logout>Logout</button>
          </div>
        </div>
      </header>`;
  },

  /* ---- Navigasi bawah (khusus HP): hanya modul milik role ---- */
  bottomNav(path, allowed) {
    const items = Auth.visibleMenu().map((m) => {
      const r = Auth.firstRoute(m);
      const on = m.route ? path === m.route || (allowed && path.startsWith(m.route + '/'))
        : allowed && (m.children || []).some((c) => path === c.route || path.startsWith(c.route + '/'));
      const short = m.short || m.label;
      return `<a href="#/${r}" class="${on ? 'active' : ''}" ${on ? 'aria-current="page"' : ''}>${U.icon(m.icon)}<span>${short}</span></a>`;
    }).join('');
    return `<nav class="bottom-nav" aria-label="Navigasi modul">${items}<button type="button" data-logout>${U.icon('logout')}<span>Logout</span></button></nav>`;
  },

  /* ---- Beri label kolom pada setiap sel tabel (dipakai tampilan kartu di HP) ---- */
  labelTables(root) {
    U.qsa('table.tbl', root).forEach((t) => {
      const heads = U.qsa('thead th', t).map((th) => th.textContent.trim());
      U.qsa('tbody tr', t).forEach((tr) => U.qsa('td', tr).forEach((td, i) => {
        if (!td.hasAttribute('colspan') && heads[i] !== undefined && td.dataset.label !== heads[i]) td.dataset.label = heads[i];
      }));
    });
  },

  /* ---- Halaman 403: role tidak punya izin ---- */
  forbidden(el, user, path) {
    el.innerHTML = `
      <div class="panel forbidden">
        <div class="forbidden-icon">${U.icon('lock')}</div>
        <h1>403 — Akses ditolak</h1>
        <p>Role <b>${ROLES[user.role].label}</b> tidak memiliki izin untuk membuka halaman <code>/${U.esc(path)}</code>.</p>
        <p class="muted">Percobaan akses ini dicatat pada audit trail.</p>
        <a class="btn btn-primary" href="#/dashboard">Kembali ke Dashboard</a>
      </div>`;
  },

  async logoutFlow() {
    const ok = await UI.modal({
      title: 'Logout',
      body: '<p class="center">Apakah Anda yakin ingin mengakhiri sesi?</p><p class="center muted small">Session diakhiri dan waktu logout dicatat.</p>',
      actions: [{ label: 'Batal', cls: 'btn', value: false }, { label: 'Logout', cls: 'btn btn-primary', value: true }],
    });
    if (!ok) return;
    Auth.logout();
    if (APP.onLogout) APP.onLogout();
    UI.toast(`Sesi diakhiri pukul ${U.time(new Date().toISOString())}.`);
    Router.go('login');
  },

  bindShell(user) {
    U.qsa('[data-logout]').forEach((b) => b.addEventListener('click', () => App.logoutFlow()));

    const sb = U.qs('#sidebar');
    U.qs('#menu-btn').addEventListener('click', () => sb.classList.toggle('open'));
    U.qs('#drawer-bd').addEventListener('click', () => sb.classList.remove('open'));
    U.qsa('#sidebar a').forEach((a) => a.addEventListener('click', () => sb.classList.remove('open')));

    const av = U.qs('#avatar'), am = U.qs('#avatar-menu');
    av.addEventListener('click', (e) => { e.stopPropagation(); am.hidden = !am.hidden; av.setAttribute('aria-expanded', String(!am.hidden)); });

    // Pencarian menu — menu yang boleh diakses tampil di atas; menu role lain ditandai terkunci (klik → 403)
    const input = U.qs('#top-search'), drop = U.qs('#search-drop');
    const leafOf = (m) => m.children ? m.children.map((c) => ({ label: c.label, group: m.label, route: c.route, perm: c.perm })) : [{ label: m.label, group: '', route: m.route, perm: m.perm }];
    const allLeaves = MENU.flatMap(leafOf);
    const leaves = allLeaves.filter((l) => Auth.can(l.perm));
    const locked = allLeaves.filter((l) => !Auth.can(l.perm));
    const match = (l, q) => !q || (l.label + ' ' + l.group).toLowerCase().includes(q);
    const show = () => {
      const q = input.value.trim().toLowerCase();
      const hits = leaves.filter((l) => match(l, q)).slice(0, 8);
      const lockedHits = q ? locked.filter((l) => match(l, q)).slice(0, 4) : [];
      drop.innerHTML = hits.map((h) => `<a href="#/${h.route}">${h.label}${h.group && h.group !== h.label ? `<small>${h.group}</small>` : ''}</a>`).join('')
        + (lockedHits.length ? `<div class="drop-group">Tidak ada akses untuk role ini</div>${lockedHits.map((h) => `<a href="#/${h.route}" class="locked">${U.icon('lock')}${h.label}${h.group && h.group !== h.label ? `<small>${h.group}</small>` : ''}</a>`).join('')}` : '')
        || '<div class="muted small pad">Tidak ada menu yang cocok.</div>';
      drop.hidden = false;
    };
    drop.addEventListener('pointerdown', (e) => e.preventDefault()); // jaga fokus agar tap di HP tidak hilang
    input.addEventListener('focus', show);
    input.addEventListener('input', show);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const a = U.qs('a', drop); if (a) { input.blur(); Router.go(a.getAttribute('href').slice(2)); } }
      if (e.key === 'Escape') input.blur();
    });
    input.addEventListener('blur', () => setTimeout(() => { drop.hidden = true; }, 200));
    App.tick();
  },

  tick() {
    const c = document.getElementById('clock');
    if (!c) return;
    const d = new Date();
    c.textContent = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
  },

  /* ---- Render utama setiap kali URL (hash) berubah ---- */
  render() {
    const root = App.root;
    const { path, query } = Router.parse();
    let user = Auth.user();

    // akun dinonaktifkan saat sedang login -> paksa logout
    if (user && user.status !== 'Active') {
      Auth.logout('Forced logout: akun nonaktif');
      user = null;
      root.dataset.view = '';
      Router.replace('login');
      renderLogin(root, 'Akun Anda telah dinonaktifkan. Hubungi Admin SIMRS.');
      return;
    }

    if (!user) {
      if (path !== 'login') Router.replace('login');
      root.dataset.view = 'login';
      document.title = `Sign in · SIMRS ${APP.module}`;
      renderLogin(root);
      return;
    }
    if (path === 'login' || path === '') { Router.replace('dashboard'); return App.render(); }

    // password sementara (akun baru / hasil reset) wajib diganti sebelum memakai sistem
    if (user.mustChange && typeof renderFirstPassword === 'function') {
      root.dataset.view = 'login';
      document.title = `Buat password baru · SIMRS ${APP.module}`;
      renderFirstPassword(root, user);
      return;
    }

    const m = Router.match(path);
    const allowed = !!m && Auth.can(m.route.perm);
    root.dataset.view = 'app';
    root.innerHTML = `<div class="shell">${App.sidebar(user, path, allowed)}<div class="drawer-backdrop" id="drawer-bd"></div><div class="main">${App.topbar(user)}<main class="view" id="view" tabindex="-1"></main></div></div>${App.bottomNav(path, allowed)}`;
    App.bindShell(user);
    const view = U.qs('#view');

    if (!m) {
      view.innerHTML = `<div class="panel">${C.empty('Halaman tidak ditemukan', `Alamat <code>/${U.esc(path)}</code> tidak ada.`, '<a class="btn btn-primary" href="#/dashboard">Kembali ke Dashboard</a>')}</div>`;
      document.title = `Tidak ditemukan · SIMRS ${APP.module}`;
    } else if (!allowed) {
      App.forbidden(view, user, path);
      Store.audit({ module: 'RBAC', activity: `Akses ditolak ke /${path}`, result: 'Denied' });
      document.title = `Akses ditolak · SIMRS ${APP.module}`;
    } else {
      m.route.render(view, { params: m.params, query, user });
      document.title = `${m.route.title} · SIMRS ${APP.module}`;
    }
    window.scrollTo(0, 0);
  },

  boot() {
    App.root = document.getElementById('root');
    Store.load();
    Router.current = Router.read() || '';
    window.addEventListener('hashchange', () => Router.onHashChange());
    // semua link internal (#/...) ditangani router, tidak bergantung pada navigasi browser
    document.addEventListener('click', (e) => {
      const a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
      if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      Router.go(a.getAttribute('href').slice(2));
    });
    // sinkronisasi bila data diubah dari tab lain (mis. login role lain di tab berbeda)
    window.addEventListener('storage', (e) => { if (e.key === APP.storeKey) { Store.load(); if (App.root.dataset.view === 'app') App.render(); } });
    // label tabel otomatis setiap kali isi halaman berubah
    let pending = false;
    new MutationObserver(() => {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; App.labelTables(App.root); });
    }).observe(App.root, { childList: true, subtree: true });
    // tutup menu avatar saat klik di luar
    document.addEventListener('click', (e) => {
      const am = document.getElementById('avatar-menu');
      if (am && !am.hidden && !am.contains(e.target)) { am.hidden = true; U.qs('#avatar').setAttribute('aria-expanded', 'false'); }
    });
    setInterval(App.tick, 20000);
    App.render();
  },
};

App.boot();

</script>
